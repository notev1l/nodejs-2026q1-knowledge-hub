services:
  app:
    build: 
      context: .
    ports:
      - "4000:4000"
    healthcheck:
      test: curl -f http://localhost:4000/ || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure
    networks:
      backend:
  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    restart: unless-stopped
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - db-data:/var/lid/postgresql/data
    networks:
      backend:

  adminer:
    image: adminer
    profiles:
      - debug
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      db:
          condition: service_healthy
    networks:
      backend:

volumes:
  db-data:

networks:
  backend: